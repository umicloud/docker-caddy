name: automd

on:
  push:
    branches: [main]
    paths:
      - README.md
      - compose.yaml
      - root/etc/caddy/Caddyfile
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: automd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run automd
        run: bunx automd

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No automd changes."
          else
            git commit -m "chore: apply automd"
            git push
          fi
